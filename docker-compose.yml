services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fizzbuzz-api:local
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: "${HTTP_ADDR:-0.0.0.0:8080}"
      HTTP_PORT: "${HTTP_PORT:-8080}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8080}"
      SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:-10s}"
      MONGO_URI: "${MONGO_URI:-mongodb://mongo:27017}"
      MONGO_DATABASE: "${MONGO_DATABASE:-fizzbuzz}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-fizzbuzz-api}"
      SERVICE_VERSION: "${SERVICE_VERSION:-docker}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-jaeger:4318}"
      TRACING_ENABLED: "${TRACING_ENABLED:-true}"
      ENVIRONMENT: "${ENVIRONMENT:-docker}"
    depends_on:
      mongo:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686"
      - "4318:4318"  
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

volumes:
  mongo-data:
